name: release

on:
  push:
    tags:
      - "v*"

# A tag push triggers one coordinated release for both distributions.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build both distributions
        run: |
          rm -rf dist/mpremoteboard dist/mpflash
          uv build --package mpremoteboard --no-sources --out-dir dist/mpremoteboard
          uv build --package mpflash --no-sources --out-dir dist/mpflash

      - name: Verify distribution metadata
        run: |
          uv run --isolated --no-project python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          def metadata(path: Path):
              with ZipFile(path) as archive:
                  name = next(item for item in archive.namelist() if item.endswith(".dist-info/METADATA"))
                  return Parser().parsestr(archive.read(name).decode())

          board_metadata = metadata(next(Path("dist/mpremoteboard").glob("*.whl")))
          flash_metadata = metadata(next(Path("dist/mpflash").glob("*.whl")))
          assert board_metadata["Name"] == "mpremoteboard"
          assert flash_metadata["Name"] == "mpflash"
          board_requirements = board_metadata.get_all("Requires-Dist") or []
          flash_requirements = flash_metadata.get_all("Requires-Dist") or []
          assert not any("workspace" in requirement.lower() for requirement in board_requirements + flash_requirements)
          assert any(requirement.startswith("mpremoteboard==") for requirement in flash_requirements)
          assert not any(requirement.startswith("mpflash") for requirement in board_requirements)
          print("Verified package names and versioned cross-package metadata")
          PY

      - name: Upload distribution artefacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-mpremoteboard:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mpremoteboard/
    permissions:
      id-token: write
    steps:
      - name: Download distribution artefacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish mpremoteboard to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/mpremoteboard/

  publish-mpflash:
    needs: publish-mpremoteboard
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mpflash/
    permissions:
      id-token: write
    steps:
      - name: Download distribution artefacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish mpflash to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/mpflash/

  github-release:
    needs: publish-mpflash
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so --generate-notes can resolve the previous tag.
          fetch-depth: 0

      - name: Download distribution artefacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
